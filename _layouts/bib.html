---
<div class="publication">
  <div class="text">
    {{ reference }}
    {% if entry.arxiv_url %}
      <a href="{{ entry.arxiv_url | prepend: site.baseurl }}" target="_blank" style="color: red;">arXiv</a>
    {% endif %}
    {% if entry.arxiv_url and entry.publisher_url %}|{% endif %}
    {% if entry.publisher_url %}
      <a href="{{ entry.publisher_url | prepend: site.baseurl }}" target="_blank">publisher</a>
    {% endif %}
  </div>
</div>
