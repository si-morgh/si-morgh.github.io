---
layout: base
---
<article class="post">

  {%- comment -%}
    Same as `page`, but the title is available to assistive technology and to
    jekyll-seo-tag without being drawn on the page.
  {%- endcomment -%}
  {% if page.title %}
    <h1 class="visually-hidden">{{ page.title | escape }}</h1>
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>

</article>
