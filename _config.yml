# Site settings
title: Simorq-Home
description: ""
author:
  name: Rahman Mohammadpour
  email: frng-mpr@proton.me
affiliation: "Institute of Mathematics of Polish Academy of Sciences"

# URLs
url: "https://si-morgh.github.io"
baseurl: ""
permalink: /:categories/:title/

# Build
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-scholar

# jekyll-scholar. Reads _bibliography/bibliography.bib and renders each entry
# through _layouts/bib.html.
scholar:
  style: apa
  locale: en
  bibliography: "bibliography.bib"
  bibliography_list_tag: ul
  sort_by: year
  order: ascending
  bibliography_template: bib

include:
  - _static
  - assets

# Both menus are defined in _data/navigation.yml and rendered by
# _includes/header.html, which picks the menu from each page's `section:`.
